name: diting
description: "谛听 DITING — Android 客户端（Flutter 重写，兼容 1.4.3 数据）。"
publish_to: 'none'
# versionCode is major*10000 + minor*100 + patch (2.0.1 = 20001) so upgrades are
# never treated as downgrades.
version: 2.1.10+20110

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  # Pinned to the versions used by the original app.
  material_ui: 1.5.0                     # Material3 widgets (superellipse, Easing)
  material_color_utilities: 0.13.0       # HCT / DynamicColor
  material_new_shapes: 1.0.0             # RoundedPolygon for empty-state art
  animations: 3.0.0                      # FadeThrough / OpenContainer
  path_parsing: 1.1.0                    # Parses Glyph SVG paths
  collection: ^1.19.1

  # State management and routing.
  flutter_riverpod: 3.4.3
  go_router: ^16.0.0

  # Reads the legacy SQLite database directly.
  sqflite: ^2.4.2
  path: ^1.9.1

  intl: any
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.6
  # Drives the timers behind the power-key timeout in power_guard_test.
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/https_passthrough.txt
    # Brand icon drawn on the about page hero.
    - assets/images/
    # Payment QR codes for the sponsor page. The member list and avatars are not
    # bundled; they are fetched as recognition_members.json plus avatars/.
    - assets/pay/
  shaders:
    - shaders/liquid_glass.frag
