name: diting
description: "谛听 DITING — Android 客户端（Flutter 重写，兼容 1.4.3 数据）。"
publish_to: 'none'
# 旧版最新为 1.4.3 / versionCode 10403；本版按 major*10000+minor*100+patch 递增，
# 保证 upgrade 安装时不会被系统判为降级。
version: 1.4.4+10404

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  # —— 与 DITING 1.4.3 pubspec.lock 对齐的锁定版本，保证移植组件 API 不漂移 ——
  material_ui: 1.5.0                     # Flutter 官方拆出的 Material3 库（superellipse/Easing）
  material_color_utilities: 0.13.0       # HCT / DynamicColor 取色
  material_new_shapes: 1.0.0             # RoundedPolygon 空状态插画
  animations: 3.0.0                      # FadeThrough / OpenContainer
  path_parsing: 1.1.0                    # Glyph SVG path 解析
  emoji_regex: 0.0.5                     # EmojiText 分组
  collection: ^1.19.1

  # —— 演示状态与路由（迁移文档 D3 选型）——
  flutter_riverpod: 3.4.3
  go_router: ^16.0.0

  # —— 旧版数据兼容：直接打开 1.4.3 的 SQLite 文件 ——
  sqflite: ^2.4.2
  path: ^1.9.1

  intl: any
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.6

flutter:
  uses-material-design: true
  assets:
    - assets/https_passthrough.txt
  shaders:
    - shaders/liquid_glass.frag
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
    - family: Twemoji
      fonts:
        - asset: assets/fonts/Twemoji.Mozilla.ttf
