# Flutter gen-l10n configuration. `flutter pub get` / `flutter run` / `flutter test`
# regenerate lib/l10n/app_localizations*.dart from the ARB files below.
#
# Adding a language: create lib/l10n/app_<code>.arb, add the Locale to AppLanguageMode
# (lib/state/settings_providers.dart) and to the `supportedLocales` list it exposes.
arb-dir: lib/l10n
template-arb-file: app_zh.arb
output-localization-file: app_localizations.dart
output-class: AppL10n
nullable-getter: false
